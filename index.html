<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>움짤 메이커</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #14161a; color: #e6e8ec;
  font: 14px/1.5 "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 20px; margin: 8px 0 2px; letter-spacing: -.3px; }
h1 span { color: #4c8dff; }
.sub { color: #767d8a; font-size: 12.5px; margin-bottom: 20px; }
.card { background: #1c1f26; border: 1px solid #262a33; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 13px; margin: 0 0 12px; color: #a8b0bd; font-weight: 600; letter-spacing: .2px; }
.card h2 em { font-style: normal; color: #6b7280; font-weight: 400; margin-left: 6px; }
[hidden] { display: none !important; }

#drop {
  border: 2px dashed #333a45; border-radius: 12px; padding: 44px 20px; text-align: center;
  cursor: pointer; transition: .15s; background: #1a1d23;
}
#drop:hover, #drop.over { border-color: #4c8dff; background: #1e242e; }
#drop svg { opacity: .5; margin-bottom: 10px; }
#drop b { display: block; font-size: 15px; margin-bottom: 4px; }
#drop small { color: #767d8a; }

/* ---- 비디오 + 크롭 오버레이 ---- */
.vid-box { background: #000; border-radius: 8px; text-align: center; padding: 0; overflow: hidden; }
#stage { position: relative; display: inline-block; line-height: 0; max-width: 100%; overflow: hidden; }
video { max-width: 100%; max-height: 320px; display: block; }
#cropBox {
  position: absolute; border: 1px solid rgba(255,255,255,.95); cursor: move;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.55); touch-action: none;
}
#cropBox.off { display: none; }
#cropBox::before, #cropBox::after {
  content: ''; position: absolute; pointer-events: none; opacity: .35;
  border-color: #fff; border-style: solid; border-width: 0;
}
#cropBox::before { left: 33.33%; right: 33.33%; top: 0; bottom: 0; border-left-width: 1px; border-right-width: 1px; }
#cropBox::after { top: 33.33%; bottom: 33.33%; left: 0; right: 0; border-top-width: 1px; border-bottom-width: 1px; }
.hd {
  --hs: 14px; --ho: calc(var(--hs) / -2);
  position: absolute; width: var(--hs); height: var(--hs);
  background: #4c8dff; border: 2px solid #fff; border-radius: 3px; touch-action: none;
}
.hd[data-h=nw] { left: var(--ho); top: var(--ho); cursor: nwse-resize; }
.hd[data-h=ne] { right: var(--ho); top: var(--ho); cursor: nesw-resize; }
.hd[data-h=sw] { left: var(--ho); bottom: var(--ho); cursor: nesw-resize; }
.hd[data-h=se] { right: var(--ho); bottom: var(--ho); cursor: nwse-resize; }
.hd[data-h=n] { left: 50%; margin-left: var(--ho); top: var(--ho); cursor: ns-resize; }
.hd[data-h=s] { left: 50%; margin-left: var(--ho); bottom: var(--ho); cursor: ns-resize; }
.hd[data-h=w] { top: 50%; margin-top: var(--ho); left: var(--ho); cursor: ew-resize; }
.hd[data-h=e] { top: 50%; margin-top: var(--ho); right: var(--ho); cursor: ew-resize; }
/* 손가락용 히트 영역 확대 */
@media (pointer: coarse) {
  .hd { --hs: 26px; border-width: 3px; border-radius: 5px; }
  .seg button { padding: 9px 4px; }
  .btn.tiny { padding: 9px 14px; }
  .range-wrap input[type=range]::-webkit-slider-thumb { width: 20px; height: 30px; margin-top: 2px; }
  .range-wrap input[type=range]::-moz-range-thumb { width: 18px; height: 28px; }
}
.crop-info { position: absolute; left: 0; top: -1px; transform: translateY(-100%);
  background: rgba(0,0,0,.75); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px;
  white-space: nowrap; line-height: 1.5; pointer-events: none; }

.meta { display: flex; gap: 14px; flex-wrap: wrap; color: #767d8a; font-size: 12px; margin-top: 10px; }
.meta b { color: #c3c9d4; font-weight: 600; }

.range-wrap { position: relative; height: 34px; margin: 18px 2px 4px; }
.range-track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: #2f3540; }
.range-sel { position: absolute; top: 14px; height: 6px; background: #4c8dff; border-radius: 3px; }
.range-wrap input[type=range] {
  position: absolute; left: 0; top: 0; width: 100%; height: 34px; margin: 0;
  background: none; -webkit-appearance: none; appearance: none; pointer-events: none;
}
.range-wrap input[type=range]:focus { outline: none; }
.range-wrap input[type=range]::-webkit-slider-runnable-track { background: none; height: 34px; }
.range-wrap input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto; width: 14px; height: 26px; margin-top: 4px;
  border-radius: 5px; background: #4c8dff; border: 2px solid #fff; cursor: ew-resize;
}
.range-wrap input[type=range]::-moz-range-track { background: none; height: 34px; }
.range-wrap input[type=range]::-moz-range-thumb {
  pointer-events: auto; width: 12px; height: 24px; border-radius: 5px;
  background: #4c8dff; border: 2px solid #fff; cursor: ew-resize;
}
.trim-labels { display: flex; justify-content: space-between; font-size: 12px; color: #a8b0bd; }
.trim-labels b { color: #4c8dff; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
label.f { display: block; }
label.f > span { display: block; font-size: 11.5px; color: #767d8a; margin-bottom: 5px; }
select {
  width: 100%; background: #14171d; color: #e6e8ec; border: 1px solid #333a45;
  border-radius: 7px; padding: 8px 9px; font: inherit; font-size: 13px;
}
select:focus { outline: none; border-color: #4c8dff; }

.seg { display: flex; background: #14171d; border: 1px solid #333a45; border-radius: 7px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button {
  flex: 1; background: none; border: 0; color: #98a0ad; padding: 6px 4px; border-radius: 5px;
  font: inherit; font-size: 12.5px; cursor: pointer; transition: .12s; white-space: nowrap;
}
.seg button.on { background: #4c8dff; color: #fff; font-weight: 600; }
.seg button:hover:not(.on) { color: #e6e8ec; }
.seg.small button { font-size: 12px; padding: 5px 3px; }

.est { margin-top: 12px; font-size: 12px; color: #767d8a; }
.est b { color: #c3c9d4; }
.warn { color: #ffb454; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: #4c8dff; color: #fff; border: 0; border-radius: 8px; padding: 11px 18px;
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: .12s;
}
.btn:hover { background: #3d7ceb; }
.btn:disabled { background: #2c313a; color: #6b7280; cursor: default; }
.btn.ghost { background: #262b34; color: #c3c9d4; }
.btn.ghost:hover { background: #303643; }
.btn.wide { width: 100%; }
.btn.tiny { padding: 6px 11px; font-size: 12px; font-weight: 500; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1; min-width: 140px; }

.prog { margin-top: 14px; }
.prog-bar { height: 6px; background: #2f3540; border-radius: 3px; overflow: hidden; }
.prog-bar i { display: block; height: 100%; background: #4c8dff; width: 0; transition: width .12s; }
.prog-txt { font-size: 12px; color: #a8b0bd; margin-top: 7px; font-variant-numeric: tabular-nums; }

.result-box { background: #0d0f13; border-radius: 8px; padding: 14px; text-align: center; }
#preview { max-width: 100%; border-radius: 4px; background: #000; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; justify-content: center; }
.chip { background: #22262f; border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #a8b0bd; }
.chip b { color: #e6e8ec; }
.note { font-size: 11.5px; color: #6b7280; margin-top: 12px; line-height: 1.6; }
.err { color: #ff6b6b; font-size: 12.5px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>움짤 <span>메이커</span></h1>
  <p class="sub">동영상을 잘라 GIF·동영상 움짤로. 업로드 없이 브라우저 안에서만 처리됩니다.</p>

  <div id="drop">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e6e8ec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <b>동영상 파일을 여기로 끌어다 놓기</b>
    <small>또는 클릭해서 선택 &nbsp;·&nbsp; mp4 / webm / mov</small>
    <input type="file" id="file" accept="video/*" hidden>
  </div>

  <div id="editor" hidden>
    <div class="card">
      <h2>1. 구간 &amp; 크롭</h2>
      <div class="vid-box">
        <div id="stage">
          <video id="video" muted playsinline preload="auto"></video>
          <div id="cropBox" class="off">
            <div class="crop-info" id="cropInfo"></div>
            <div class="hd" data-h="nw"></div><div class="hd" data-h="n"></div><div class="hd" data-h="ne"></div>
            <div class="hd" data-h="w"></div><div class="hd" data-h="e"></div>
            <div class="hd" data-h="sw"></div><div class="hd" data-h="s"></div><div class="hd" data-h="se"></div>
          </div>
        </div>
      </div>

      <div class="range-wrap">
        <div class="range-track"></div><div class="range-sel" id="rsel"></div>
        <input type="range" id="rStart" min="0" max="100" step="0.01" value="0">
        <input type="range" id="rEnd" min="0" max="100" step="0.01" value="100">
      </div>
      <div class="trim-labels">
        <span>시작 <b id="lStart">0.00s</b></span>
        <span>길이 <b id="lDur">0.00s</b></span>
        <span>끝 <b id="lEnd">0.00s</b></span>
      </div>

      <div style="margin-top:16px">
        <label class="f"><span>크롭 비율</span>
          <div class="seg small" id="segCrop">
            <button data-v="off" class="on">끄기</button>
            <button data-v="free">자유</button>
            <button data-v="1:1">1:1</button>
            <button data-v="4:5">4:5</button>
            <button data-v="9:16">9:16</button>
            <button data-v="16:9">16:9</button>
            <button data-v="3:4">3:4</button>
          </div>
        </label>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn ghost tiny" id="btnCropFull">전체 선택</button>
          <button class="btn ghost tiny" id="btnCropCenter">가운데 맞춤</button>
        </div>
      </div>
      <div class="meta" id="vmeta"></div>
    </div>

    <div class="card">
      <h2>2. 설정</h2>
      <div class="grid">
        <label class="f"><span>모드</span>
          <div class="seg" id="segMode">
            <button data-v="normal" class="on">일반</button>
            <button data-v="boomerang">부메랑</button>
          </div>
        </label>
        <label class="f"><span>재생 배속</span>
          <select id="selSpeed">
            <option value="0.25">0.25x (아주 느리게)</option>
            <option value="0.5">0.5x (느리게)</option>
            <option value="1" selected>1.0x (원본)</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
            <option value="3">3.0x</option>
            <option value="5">5.0x (아주 빠르게)</option>
          </select>
        </label>
        <label class="f"><span>가로 크기</span>
          <select id="selW">
            <option value="240">240px</option>
            <option value="320">320px</option>
            <option value="480" selected>480px</option>
            <option value="640">640px</option>
            <option value="0">원본(크롭) 크기</option>
          </select>
        </label>
        <label class="f"><span>초당 프레임</span>
          <select id="selFps">
            <option value="8">8 fps</option>
            <option value="10">10 fps</option>
            <option value="12">12 fps</option>
            <option value="15" selected>15 fps</option>
            <option value="20">20 fps</option>
            <option value="25">25 fps</option>
          </select>
        </label>
        <label class="f"><span>색상 수 (GIF)</span>
          <select id="selColors">
            <option value="64">64색 (작게)</option>
            <option value="128">128색</option>
            <option value="256" selected>256색 (최상)</option>
          </select>
        </label>
        <label class="f"><span>디더링 (GIF)</span>
          <select id="selDither">
            <option value="fs" selected>Floyd-Steinberg</option>
            <option value="bayer">Bayer</option>
            <option value="none">없음</option>
          </select>
        </label>
        <label class="f"><span>화질 (WebP)</span>
          <select id="selWq">
            <option value="0.6">60% (아주 작게)</option>
            <option value="0.75">75%</option>
            <option value="0.85" selected>85% (권장)</option>
            <option value="0.95">95% (고화질)</option>
          </select>
        </label>
      </div>
      <div class="est" id="est"></div>
      <div class="prog" id="prog" hidden>
        <div class="prog-bar"><i id="progBar"></i></div>
        <div class="prog-txt" id="progTxt"></div>
      </div>
      <div style="margin-top:14px">
        <button class="btn wide" id="btnMake">움짤 만들기</button>
      </div>
      <div class="err" id="err" hidden></div>
    </div>

    <div class="card" id="resultCard" hidden>
      <h2>3. 결과 <em id="resHint"></em></h2>
      <div class="result-box">
        <canvas id="preview"></canvas>
        <div class="chips" id="chips"></div>
      </div>
      <div style="margin:14px 0 0">
        <div class="seg" id="segMode2" style="max-width:260px;margin:0 auto 14px">
          <button data-v="normal" class="on">일반 재생</button>
          <button data-v="boomerang">부메랑 재생</button>
        </div>
        <div class="row">
          <button class="btn" id="btnWebp">WebP로 저장</button>
          <button class="btn ghost" id="btnGif">GIF로 저장</button>
          <button class="btn ghost" id="btnVid">동영상으로 저장</button>
        </div>
        <p class="note" style="margin-top:10px">
          <b style="color:#a8b0bd">WebP</b>가 대체로 가장 작고 (GIF의 1/3~1/10), 이미지라서 GIF처럼 그대로 붙습니다.
          <b style="color:#a8b0bd">GIF</b>는 호환성이 필요할 때 (카톡·구형 커뮤니티).
          움직임이 많고 긴 영상은 <b style="color:#a8b0bd">동영상</b>이 더 작을 수 있으니, 저장해 보고 위 용량을 비교하세요.
        </p>
        <p class="note" id="supNote" style="margin-top:6px"></p>
      </div>
      <div class="prog" id="prog2" hidden>
        <div class="prog-bar"><i id="progBar2"></i></div>
        <div class="prog-txt" id="progTxt2"></div>
      </div>
      <p class="note" id="outNote"></p>
    </div>
  </div>
</div>

  FIELDS.forEach(function (id) { s[id] = $(id).value; });
  try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) { /* 무시 */ }
}

/* ---------- 파일 열기 ---------- */
var drop = $('drop');
drop.addEventListener('click', function () { $('file').click(); });
drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
drop.addEventListener('drop', function (e) {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});
$('file').addEventListener('change', function (e) {
  if (e.target.files[0]) openFile(e.target.files[0]);
});

function openFile(f) {
  if (f.type.indexOf('video') !== 0 && !/\.(mp4|webm|mov|m4v|ogv|mkv)$/i.test(f.name)) {
    showErr('동영상 파일이 아닙니다.'); return;
  }
  stopPreview();
  showErr('');
  $('resultCard').hidden = true;
  st.frames = []; st.cache = {};
  if (st.url) URL.revokeObjectURL(st.url);
  st.url = URL.createObjectURL(f);
  st.name = f.name.replace(/\.[^.]+$/, '');
  st.size = f.size;
  video.src = st.url;
  video.load();
}

video.addEventListener('loadedmetadata', function () {
  if (!isFinite(video.duration) || video.duration <= 0) {
    showErr('영상 길이를 읽을 수 없는 파일입니다. mp4나 webm으로 변환해 주세요.');
    return;
  }
  st.dur = video.duration;
  st.vw = video.videoWidth;
  st.vh = video.videoHeight;
  st.start = 0;
  st.end = Math.min(st.dur, 4);
  st.crop = { x: 0, y: 0, w: 1, h: 1 };
  setCropMode('off', true);

  var rs = $('rStart'), re = $('rEnd');
  rs.min = re.min = 0;
  rs.max = re.max = st.dur;
  rs.step = re.step = Math.max(0.01, +(st.dur / 2000).toFixed(4));
  rs.value = st.start; re.value = st.end;

  $('editor').hidden = false;
  renderMeta();
  renderTrim();
  renderCrop();
  seek(st.start);
});
video.addEventListener('error', function () {
  showErr('이 브라우저가 재생할 수 없는 코덱입니다. (mp4 H.264 / webm 권장)');
});

function renderMeta() {
  var c = cropPx();
  $('vmeta').innerHTML =
    '<span>파일 <b>' + escapeHtml(st.name) + '</b></span>' +
    '<span>원본 <b>' + st.vw + '×' + st.vh + '</b></span>' +
    '<span>길이 <b>' + st.dur.toFixed(2) + 's</b></span>' +
    '<span>용량 <b>' + fmtB(st.size) + '</b></span>' +
    (st.cropMode !== 'off' ? '<span>크롭 <b>' + c.sw + '×' + c.sh + '</b></span>' : '');
}

/* ---------- 구간 슬라이더 ---------- */
var rs = $('rStart'), re = $('rEnd');
rs.addEventListener('input', function () {
  st.start = clamp(+rs.value, 0, st.end - 0.1);
  rs.value = st.start;
  renderTrim(); seek(st.start);
});
re.addEventListener('input', function () {
  st.end = clamp(+re.value, st.start + 0.1, st.dur);
  re.value = st.end;
  renderTrim(); seek(st.end);
});

function renderTrim() {
  var a = st.start / st.dur * 100, b = st.end / st.dur * 100;
  var sel = $('rsel');
  sel.style.left = a + '%';
  sel.style.width = (b - a) + '%';
  $('lStart').textContent = fmtT(st.start);
  $('lEnd').textContent = fmtT(st.end);
  $('lDur').textContent = fmtT(st.end - st.start);
  renderEst(); stale(true);
}

var seekBusy = false, seekWant = null;
function seek(t) {
  if (seekBusy) { seekWant = t; return; }
  seekBusy = true;
  seekTo(video, t).then(function () {
    seekBusy = false;
    if (seekWant != null) { var w = seekWant; seekWant = null; seek(w); }
  });
}
function seekTo(v, t) {
  return new Promise(function (res) {
    if (Math.abs(v.currentTime - t) < 0.0008) { res(); return; }
    var to = setTimeout(function () { done(); }, 2500);
    function done() { clearTimeout(to); v.removeEventListener('seeked', done); res(); }
    v.addEventListener('seeked', done);
    v.currentTime = t;
  });
}

/* ================= 크롭 ================= */
function parseRatio(v) {
  if (v === 'off' || v === 'free') return 0;
  var p = v.split(':');
  return +p[0] / +p[1];
}
/* 지정 비율(픽셀 기준 w/h)에 맞는 최대 사각형을 정규화 좌표로 */
function ratioBox(R, cx, cy) {
  var wN = 1, hN = st.vw / (R * st.vh);
  if (hN > 1) { hN = 1; wN = R * st.vh / st.vw; }
  return {
    x: clamp(cx - wN / 2, 0, 1 - wN), y: clamp(cy - hN / 2, 0, 1 - hN),
    w: wN, h: hN
  };
}
function cropPx() {
  var c = st.cropMode === 'off' ? { x: 0, y: 0, w: 1, h: 1 } : st.crop;
  var sw = Math.max(2, Math.round(c.w * st.vw));
  var sh = Math.max(2, Math.round(c.h * st.vh));
  sw = Math.min(sw, st.vw); sh = Math.min(sh, st.vh);
  var sx = clamp(Math.round(c.x * st.vw), 0, st.vw - sw);
  var sy = clamp(Math.round(c.y * st.vh), 0, st.vh - sh);
  return { sx: sx, sy: sy, sw: sw, sh: sh };
}
function renderCrop() {
  cropBox.classList.toggle('off', st.cropMode === 'off');
  if (st.cropMode === 'off') { renderMeta(); return; }
  var c = st.crop;
  cropBox.style.left = (c.x * 100) + '%';
  cropBox.style.top = (c.y * 100) + '%';
  cropBox.style.width = (c.w * 100) + '%';
  cropBox.style.height = (c.h * 100) + '%';
  var p = cropPx();
  $('cropInfo').textContent = p.sw + '×' + p.sh;
  renderMeta();
}
function setCropMode(v, silent) {
  var prev = st.cropMode;
  st.cropMode = v;
  st.ratio = parseRatio(v);
  Array.prototype.forEach.call($('segCrop').children, function (b) {
    b.classList.toggle('on', b.getAttribute('data-v') === v);
  });
  if (v !== 'off') {
    var cx = prev === 'off' ? 0.5 : st.crop.x + st.crop.w / 2;
    var cy = prev === 'off' ? 0.5 : st.crop.y + st.crop.h / 2;
    if (st.ratio) st.crop = ratioBox(st.ratio, cx, cy);
    else if (prev === 'off') st.crop = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
  }
  renderCrop();
  if (!silent) { renderEst(); stale(true); st.cache = {}; }
}
$('segCrop').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button') : null;
  if (b) setCropMode(b.getAttribute('data-v'));
});
$('btnCropFull').addEventListener('click', function () {
  if (st.cropMode === 'off') setCropMode('free');
  st.crop = st.ratio ? ratioBox(st.ratio, 0.5, 0.5) : { x: 0, y: 0, w: 1, h: 1 };
  renderCrop(); renderEst(); stale(true); st.cache = {};
});
$('btnCropCenter').addEventListener('click', function () {
  if (st.cropMode === 'off') return;
  st.crop.x = clamp(0.5 - st.crop.w / 2, 0, 1 - st.crop.w);
  st.crop.y = clamp(0.5 - st.crop.h / 2, 0, 1 - st.crop.h);
  renderCrop(); renderEst(); stale(true); st.cache = {};
});

/* 드래그 / 리사이즈 */
var drag = null;
cropBox.addEventListener('pointerdown', function (e) {
  if (st.cropMode === 'off') return;
  var h = e.target.getAttribute('data-h') || 'move';
  var r = stage.getBoundingClientRect();
  drag = {
    h: h, x0: e.clientX, y0: e.clientY, rw: r.width, rh: r.height,
    box: { x: st.crop.x, y: st.crop.y, w: st.crop.w, h: st.crop.h }
  };
  try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  e.preventDefault();
});
window.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var dx = (e.clientX - drag.x0) / drag.rw, dy = (e.clientY - drag.y0) / drag.rh;
  var b0 = drag.box, R = st.ratio;
  var minW = Math.min(0.9, 24 / st.vw), minH = Math.min(0.9, 24 / st.vh);
  var b;
  if (drag.h === 'move') {
    b = { x: clamp(b0.x + dx, 0, 1 - b0.w), y: clamp(b0.y + dy, 0, 1 - b0.h), w: b0.w, h: b0.h };
  } else {
    var L = b0.x, T = b0.y, Rt = b0.x + b0.w, B = b0.y + b0.h;
    if (drag.h.indexOf('w') >= 0) L = clamp(L + dx, 0, Rt - minW);
    if (drag.h.indexOf('e') >= 0) Rt = clamp(Rt + dx, L + minW, 1);
    if (drag.h.indexOf('n') >= 0) T = clamp(T + dy, 0, B - minH);
    if (drag.h.indexOf('s') >= 0) B = clamp(B + dy, T + minH, 1);
    b = { x: L, y: T, w: Rt - L, h: B - T };
    if (R) b = lockRatio(b, drag.h, R);
  }
  st.crop = b;
  renderCrop();
});
window.addEventListener('pointerup', function () {
  if (!drag) return;
  drag = null;
  renderEst(); stale(true); st.cache = {};
});

/* 비율 고정: 드래그 방향에 따라 고정 변을 두고 나머지 한 변을 계산 */
function lockRatio(b, h, R) {
  var hFromW = function (w) { return w * st.vw / (R * st.vh); };
  var wFromH = function (hh) { return hh * R * st.vh / st.vw; };
  if (h === 'n' || h === 's') {
    var w = Math.min(1, wFromH(b.h));
    var cx = b.x + b.w / 2;
    b.w = w; b.x = clamp(cx - w / 2, 0, 1 - w);
    if (b.h > 1) b.h = 1;
    return b;
  }
  var nh = hFromW(b.w);
  if (nh > 1) { nh = 1; b.w = Math.min(1, wFromH(1)); }
  if (h === 'w' || h === 'e') {
    var cy = b.y + b.h / 2;
    b.h = nh; b.y = clamp(cy - nh / 2, 0, 1 - nh);
  } else if (h.indexOf('n') >= 0) {
    var bottom = b.y + b.h;
    b.h = nh; b.y = clamp(bottom - nh, 0, 1 - nh);
  } else {
    b.h = nh;
    if (b.y + b.h > 1) { b.h = 1 - b.y; b.w = Math.min(1, wFromH(b.h)); }
  }
  b.x = clamp(b.x, 0, 1 - b.w);
  b.y = clamp(b.y, 0, 1 - b.h);
  return b;
}

/* ---------- 출력 규격 ---------- */
function baseDelay(fps) { return Math.max(20, Math.round(1000 / fps / 10) * 10); }
function outSize() {
  var c = cropPx();
  var want = +$('selW').value || c.sw;
  var w = Math.min(want, c.sw);
  var h = Math.round(w * c.sh / c.sw);
  w -= w % 2; h -= h % 2;
  return { w: Math.max(2, w), h: Math.max(2, h) };
}
/* 모바일은 탭 메모리 한도가 훨씬 낮아 예산을 줄인다 */
function frameCap(w, h) {
  var coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  return Math.max(4, Math.min(coarse ? 150 : 320, Math.floor((coarse ? 70e6 : 160e6) / (w * h * 4))));
}
function plan() {
  var fps = +$('selFps').value, speed = +$('selSpeed').value;
  var s = outSize();
  var span = st.end - st.start;
  var want = Math.max(2, Math.round(span / speed * fps));
  var cap = frameCap(s.w, s.h);
  return {
    w: s.w, h: s.h, fps: fps, speed: speed, span: span,
    n: Math.min(want, cap), want: want, cap: cap, delay: baseDelay(fps)
  };
}
function seqOf(n) {
  var a = [], i;
  for (i = 0; i < n; i++) a.push(i);
  if (st.mode === 'boomerang' && n >= 3) for (i = n - 2; i >= 1; i--) a.push(i);
  return a;
}
function totalMs(seq) {
  var t = 0;
  for (var i = 0; i < seq.length; i++) t += st.frames[seq[i]].delay;
  return t;
}

function renderEst() {
  if (!st.dur) return;
  var p = plan();
  var out = st.mode === 'boomerang' && p.n >= 3 ? p.n * 2 - 2 : p.n;
  var msg = '추출 <b>' + p.n + '장</b>' +
    (st.mode === 'boomerang' ? ' &rarr; 부메랑 <b>' + out + '장</b>' : '') +
    ' &nbsp;·&nbsp; 출력 <b>' + p.w + '×' + p.h + '</b>' +
    ' &nbsp;·&nbsp; 재생 <b>' + (out * p.delay / 1000).toFixed(2) + 's</b>' +
    ' &nbsp;·&nbsp; 실제 <b>' + (1000 / p.delay).toFixed(1) + ' fps</b>';
  if (p.speed < 1) msg += '<br>느린 배속은 같은 프레임이 반복될 수 있어, 중복 프레임은 자동으로 하나로 합쳐 표시 시간을 늘립니다.';
  if (p.want > p.cap) msg += '<br><span class="warn">메모리 한계로 ' + p.cap + '장까지만 추출합니다. 구간·크기·fps를 줄이거나 배속을 올려 주세요.</span>';
  else if (out > 140) msg += '<br><span class="warn">프레임이 많아 GIF 용량이 커집니다. fps나 구간을 줄이는 걸 권장.</span>';
  $('est').innerHTML = msg;
}
FIELDS.forEach(function (id) {
  $(id).addEventListener('change', function () {
    renderEst(); saveSettings(); st.cache = {}; stale(true);
  });
});

/* ---------- 모드 ---------- */
function setMode(v, silent) {
  st.mode = v;
  ['segMode', 'segMode2'].forEach(function (id) {
    var seg = $(id);
    if (!seg) return;
    Array.prototype.forEach.call(seg.children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
  });
  renderEst();
  if (!silent) { saveSettings(); st.cache = {}; if (st.frames.length) startPreview(); }
}
['segMode', 'segMode2'].forEach(function (id) {
  $(id).addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (b) setMode(b.getAttribute('data-v'));
  });
});

/* ---------- 프레임 추출 ---------- */
$('btnMake').addEventListener('click', function () { make(); });

/* 인접 프레임이 완전히 같은지 (성긴 비교로 먼저 걸러낸 뒤 전체 비교) */
function sameImg(a, b) {
  var x = a.data, y = b.data, n = x.length, i;
  for (i = 0; i < n; i += 97) if (x[i] !== y[i]) return false;
  for (i = 0; i < n; i++) if (x[i] !== y[i]) return false;
  return true;
}

async function make() {
  showErr('');
  var btn = $('btnMake');
  /* 추출 중에는 저장을 막는다. 이전 결과가 화면에 남아 있으면 저장 버튼을
     누를 수 있고, 그러면 절반만 채워진 프레임으로 인코딩된다. */
  setBusy(true);
  stopPreview();
  st.cache = {};
  $('outNote').textContent = '';
  stale(false);

  var p = plan(), c = cropPx();
  st.w = p.w; st.h = p.h; st.base = p.delay; st.dropped = 0; st.sizes = {};

  var cv = document.createElement('canvas');
  cv.width = p.w; cv.height = p.h;
  var ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  $('prog').hidden = false;
  st.frames = [];
  try {
    /* iOS Safari 는 한 번 재생을 거쳐야 seek 한 프레임을 캔버스에 그릴 수 있다.
       이 함수는 버튼 클릭(사용자 제스처) 안에서 실행되므로 play() 가 허용된다. */
    video.muted = true;
    try {
      var pp = video.play();
      if (pp && pp.then) await pp.catch(function () { });
    } catch (e) { /* 무시 */ }
    video.pause();
    for (var i = 0; i < p.n; i++) {
      var t = Math.min(st.start + i * p.span / p.n, st.dur - 0.001);
      await seekTo(video, t);
      ctx.drawImage(video, c.sx, c.sy, c.sw, c.sh, 0, 0, p.w, p.h);
      var img = ctx.getImageData(0, 0, p.w, p.h);
      var last = st.frames[st.frames.length - 1];
      if (last && sameImg(last.img, img)) { last.delay += p.delay; st.dropped++; }
      else st.frames.push({ img: img, delay: p.delay });
      setProg('prog', (i + 1) / p.n, '프레임 추출 ' + (i + 1) + ' / ' + p.n +
        (st.dropped ? '  (중복 ' + st.dropped + '장 병합)' : ''));
    }
  } catch (e) {
    showErr('프레임 추출 실패: ' + (e && e.message ? e.message : e));
    setBusy(false); $('prog').hidden = true;
    return;
  }
  $('prog').hidden = true;
  setBusy(false);
  if (!st.frames.length) { showErr('프레임을 얻지 못했습니다.'); return; }
  $('resultCard').hidden = false;
  startPreview();
  $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setProg(id, ratio, txt) {
  $(id === 'prog' ? 'progBar' : 'progBar2').style.width = (ratio * 100).toFixed(1) + '%';
  $(id === 'prog' ? 'progTxt' : 'progTxt2').textContent = txt;
}

/* 저장한 포맷들의 용량을 나란히 보여준다 (포맷 비교가 이 앱의 핵심 판단 재료) */
function renderChips() {
  var seq = seqOf(st.frames.length);
  var ms = totalMs(seq);
  var html =
    '<span class="chip">프레임 <b>' + st.frames.length + '</b></span>' +
    '<span class="chip">재생 프레임 <b>' + seq.length + '</b></span>' +
    '<span class="chip">크기 <b>' + st.w + '×' + st.h + '</b></span>' +
    '<span class="chip">재생 <b>' + (ms / 1000).toFixed(2) + 's</b></span>' +
    '<span class="chip">배속 <b>' + $('selSpeed').value + 'x</b></span>' +
    (st.dropped ? '<span class="chip">중복 병합 <b>' + st.dropped + '</b></span>' : '');
  ['WEBP', 'GIF', 'MP4', 'WEBM'].forEach(function (k) {
    if (st.sizes[k]) html += '<span class="chip">' + k + ' <b>' + fmtB(st.sizes[k]) + '</b></span>';
  });
  $('chips').innerHTML = html;
}

/* ---------- 미리보기 ---------- */
function stopPreview() { if (timer) { clearTimeout(timer); timer = null; } }
function startPreview() {
  stopPreview();
  if (!st.frames.length) return;
  var seq = seqOf(st.frames.length);
  var cv = $('preview');
  cv.width = st.w; cv.height = st.h;
  var ctx = cv.getContext('2d');
  var i = 0;
  renderChips();
  (function step() {
    var f = st.frames[seq[i]];
    ctx.putImageData(f.img, 0, 0);
    i = (i + 1) % seq.length;
    timer = setTimeout(step, f.delay);
  })();
}

/* ---------- 팔레트 · 디더링 ---------- */
function buildPalette(colors) {
  var fr = st.frames, np = st.w * st.h;
  var fStep = Math.max(1, Math.ceil(fr.length / 12));
  var picked = [];
  for (var i = 0; i < fr.length; i += fStep) picked.push(fr[i].img);
  var pStep = Math.max(1, Math.ceil(picked.length * np / 250000));
  var cnt = 0, p;
  for (p = 0; p < np; p += pStep) cnt++;
  var buf = new Uint8Array(cnt * picked.length * 4), o = 0;
  for (i = 0; i < picked.length; i++) {
    var d = picked[i].data;
    for (p = 0; p < np; p += pStep) {
      var s = p * 4;
      buf[o++] = d[s]; buf[o++] = d[s + 1]; buf[o++] = d[s + 2]; buf[o++] = 255;
    }
  }
  return gifenc.quantize(buf, colors, { format: 'rgb565', clearAlpha: false });
}

var BAYER = [
  [0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]
];
function ditherBayer(img, colors) {
  var w = st.w, h = st.h, d = img.data;
  var out = new Uint8ClampedArray(d.length);
  var amp = colors >= 256 ? 14 : (colors >= 128 ? 20 : 30);
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var o = (y * w + x) * 4;
      var k = (BAYER[y & 3][x & 3] / 16 - 0.46875) * amp;
      out[o] = d[o] + k; out[o + 1] = d[o + 1] + k; out[o + 2] = d[o + 2] + k; out[o + 3] = 255;
    }
  }
  return new Uint8Array(out.buffer);
}

/* Floyd-Steinberg: rgb565 캐시로 최근접 색 탐색 비용을 줄인다 */
function ditherFS(img, pal) {
  var w = st.w, h = st.h, d = img.data, n = w * h;
  var buf = new Float32Array(n * 3);
  for (var i = 0, o = 0, s = 0; i < n; i++, s += 4) {
    buf[o++] = d[s]; buf[o++] = d[s + 1]; buf[o++] = d[s + 2];
  }
  var index = new Uint8Array(n);
  var cache = new Int16Array(65536);
  cache.fill(-1);
  var px = [0, 0, 0];
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var p = (y * w + x) * 3;
      var r = buf[p], g = buf[p + 1], b = buf[p + 2];
      r = r < 0 ? 0 : (r > 255 ? 255 : r | 0);
      g = g < 0 ? 0 : (g > 255 ? 255 : g | 0);
      b = b < 0 ? 0 : (b > 255 ? 255 : b | 0);
      var key = ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
      var ci = cache[key];
      if (ci < 0) {
        px[0] = r; px[1] = g; px[2] = b;
        ci = gifenc.nearestColorIndex(pal, px);
        cache[key] = ci;
      }
      index[y * w + x] = ci;
      var c = pal[ci];
      var er = r - c[0], eg = g - c[1], eb = b - c[2];
      if (x + 1 < w) {
        buf[p + 3] += er * 0.4375; buf[p + 4] += eg * 0.4375; buf[p + 5] += eb * 0.4375;
      }
      if (y + 1 < h) {
        var q = ((y + 1) * w + x) * 3;
        if (x > 0) { buf[q - 3] += er * 0.1875; buf[q - 2] += eg * 0.1875; buf[q - 1] += eb * 0.1875; }
        buf[q] += er * 0.3125; buf[q + 1] += eg * 0.3125; buf[q + 2] += eb * 0.3125;
        if (x + 1 < w) { buf[q + 3] += er * 0.0625; buf[q + 4] += eg * 0.0625; buf[q + 5] += eb * 0.0625; }
      }
    }
  }
  return index;
}

/* ================= 애니메이션 WebP =================
   브라우저에는 애니메이션 WebP 인코더가 없다. 대신 프레임마다
   canvas.toBlob('image/webp') 로 정지 WebP 를 만들고, 그 안의 VP8
   비트스트림 청크를 꺼내 RIFF/ANMF 컨테이너로 직접 이어 붙인다.
   프레임마다 바뀐 영역(dirty rect)만 인코딩해 용량을 더 줄인다. */

var WEBP_OK = (function () {
  try {
    var c = document.createElement('canvas');
    c.width = c.height = 2;
    return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  } catch (e) { return false; }
})();

function u16(v) { return [v & 255, (v >> 8) & 255]; }
function u24(v) { return [v & 255, (v >> 8) & 255, (v >> 16) & 255]; }
function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
function fourcc(s) { return [s.charCodeAt(0), s.charCodeAt(1), s.charCodeAt(2), s.charCodeAt(3)]; }

/* RIFF 청크 하나 만들기 (홀수 크기는 1바이트 패딩) */
function riffChunk(tag, payload) {
  var pad = payload.length & 1;
  var out = new Uint8Array(8 + payload.length + pad);
  out.set(fourcc(tag), 0);
  out.set(u32(payload.length), 4);
  out.set(payload, 8);
  return out;
}
function concatBytes(list) {
  var n = 0, i;
  for (i = 0; i < list.length; i++) n += list[i].length;
  var out = new Uint8Array(n), o = 0;
  for (i = 0; i < list.length; i++) { out.set(list[i], o); o += list[i].length; }
  return out;
}

/* 정지 WebP 에서 ALPH / VP8 / VP8L 청크만(헤더 포함) 뽑아낸다 */
function webpBitstream(buf) {
  if (String.fromCharCode(buf[0], buf[1], buf[2], buf[3]) !== 'RIFF' ||
      String.fromCharCode(buf[8], buf[9], buf[10], buf[11]) !== 'WEBP') {
    throw new Error('정지 WebP 형식이 아닙니다');
  }
  var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  var out = [], alpha = false, pos = 12;
  while (pos + 8 <= buf.length) {
    var tag = String.fromCharCode(buf[pos], buf[pos + 1], buf[pos + 2], buf[pos + 3]);
    var size = dv.getUint32(pos + 4, true);
    var whole = 8 + size + (size & 1);
    if (tag === 'ALPH' || tag === 'VP8 ' || tag === 'VP8L') {
      out.push(buf.subarray(pos, pos + whole));
      if (tag === 'ALPH') alpha = true;
    }
    pos += whole;
  }
  if (!out.length) throw new Error('VP8 비트스트림을 찾지 못했습니다');
  return { chunks: out, alpha: alpha };
}

/* 두 프레임에서 달라진 픽셀의 바운딩 박스. ANMF 의 x/y 는 2픽셀 단위라 짝수로 맞춘다 */
function dirtyRect(a, b) {
  var w = st.w, h = st.h, da = a.data, db = b.data;
  var minX = w, minY = h, maxX = -1, maxY = -1, x, y, o;
  for (y = 0; y < h; y++) {
    var row = y * w * 4;
    for (x = 0; x < w; x++) {
      o = row + x * 4;
      if (da[o] !== db[o] || da[o + 1] !== db[o + 1] || da[o + 2] !== db[o + 2]) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return { x: 0, y: 0, w: 2, h: 2 };   // 완전히 동일한 경우
  minX &= ~1; minY &= ~1;
  return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

$('btnWebp').addEventListener('click', function () { exportWebp(); });

async function exportWebp() {
  if (st.busy) { showErr('프레임 추출이 끝난 뒤에 저장해 주세요.'); return; }
  if (!st.frames.length) return;
  if (!WEBP_OK) { showErr('이 브라우저는 WebP 인코딩을 지원하지 않습니다.'); return; }
  var q = +$('selWq').value;
  var key = 'webp|' + st.mode + '|' + q;
  if (st.cache[key]) { download(st.cache[key], outName('webp')); return; }

  var bs = [$('btnWebp'), $('btnGif'), $('btnVid')];
  bs.forEach(function (b) { b.disabled = true; });
  $('prog2').hidden = false;
  setProg('prog2', 0.02, 'WebP 인코딩 준비...');
  await tick();

  try {
    var seq = seqOf(st.frames.length);
    var full = document.createElement('canvas');
    full.width = st.w; full.height = st.h;
    var fctx = full.getContext('2d', { alpha: false });
    var sub = document.createElement('canvas');
    var sctx = sub.getContext('2d', { alpha: false });

    var anmf = [], anyAlpha = false, saved = 0;
    for (var k = 0; k < seq.length; k++) {
      var f = st.frames[seq[k]];
      var r = k === 0 ? { x: 0, y: 0, w: st.w, h: st.h }
                      : dirtyRect(st.frames[seq[k - 1]].img, f.img);
      saved += (st.w * st.h - r.w * r.h);

      fctx.putImageData(f.img, 0, 0);
      sub.width = r.w; sub.height = r.h;
      sctx.drawImage(full, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);

      var blob = await new Promise(function (res) { sub.toBlob(res, 'image/webp', q); });
      if (!blob) throw new Error('WebP 프레임 인코딩에 실패했습니다');
      var got = webpBitstream(new Uint8Array(await blob.arrayBuffer()));
      if (got.alpha) anyAlpha = true;

      var head = new Uint8Array(16);
      head.set(u24(r.x >> 1), 0);
      head.set(u24(r.y >> 1), 3);
      head.set(u24(r.w - 1), 6);
      head.set(u24(r.h - 1), 9);
      head.set(u24(f.delay), 12);
      head[15] = 0x02;                       // B=1 블렌딩 안 함, D=0 폐기 안 함
      anmf.push(riffChunk('ANMF', concatBytes([head].concat(got.chunks))));

      setProg('prog2', (k + 1) / seq.length, 'WebP 인코딩 ' + (k + 1) + ' / ' + seq.length);
      if (k % 2 === 0) await tick();
    }

    var vp8x = new Uint8Array(10);
    vp8x[0] = 0x02 | (anyAlpha ? 0x10 : 0);  // Animation (+ Alpha)
    vp8x.set(u24(st.w - 1), 4);
    vp8x.set(u24(st.h - 1), 7);
    var anim = new Uint8Array(6);            // 배경 투명 + 무한 반복
    anim.set(u16(0), 4);

    var body = concatBytes([riffChunk('VP8X', vp8x), riffChunk('ANIM', anim)].concat(anmf));
    var out = new Uint8Array(12 + body.length);
    out.set(fourcc('RIFF'), 0);
    out.set(u32(4 + body.length), 4);
    out.set(fourcc('WEBP'), 8);
    out.set(body, 12);

    var wblob = new Blob([out], { type: 'image/webp' });
    st.cache[key] = wblob;
    st.sizes.WEBP = wblob.size;
    $('prog2').hidden = true;
    renderChips();
    var pct = Math.round(saved / (st.w * st.h * seq.length) * 100);
    $('outNote').textContent = 'WebP ' + fmtB(wblob.size) + ' 저장했습니다.' +
      (pct > 0 ? ' 바뀐 영역만 인코딩해 픽셀 ' + pct + '%를 덜 담았습니다.' : '') +
      (st.sizes.GIF ? ' 같은 움짤 GIF는 ' + fmtB(st.sizes.GIF) + '였습니다.' : '') +
      SAVE_HINT;
    download(wblob, outName('webp'));
  } catch (e) {
    $('prog2').hidden = true;
    showErr('WebP 인코딩 실패: ' + (e && e.message ? e.message : e));
  }
  bs.forEach(function (b) { b.disabled = false; });
  $('btnWebp').disabled = !WEBP_OK;
}

/* ---------- GIF 저장 ---------- */
$('btnGif').addEventListener('click', function () { exportGif(); });

async function exportGif() {
  if (st.busy) { showErr('프레임 추출이 끝난 뒤에 저장해 주세요.'); return; }
  if (!st.frames.length) return;
  var colors = +$('selColors').value, dith = $('selDither').value;
  var key = 'gif|' + st.mode + '|' + colors + '|' + dith;
  if (st.cache[key]) { download(st.cache[key], outName('gif')); return; }

  var b1 = $('btnGif'), b2 = $('btnVid');
  b1.disabled = b2.disabled = true;
  $('prog2').hidden = false;
  setProg('prog2', 0.02, '팔레트 계산 중...');
  await tick();

  try {
    var pal = buildPalette(colors);
    var seq = seqOf(st.frames.length);
    var idx = new Array(st.frames.length);
    var enc = gifenc.GIFEncoder();
    for (var k = 0; k < seq.length; k++) {
      var fi = seq[k], f = st.frames[fi];
      if (!idx[fi]) {
        if (dith === 'fs') idx[fi] = ditherFS(f.img, pal);
        else if (dith === 'bayer') idx[fi] = gifenc.applyPalette(ditherBayer(f.img, colors), pal, 'rgb565');
        else idx[fi] = gifenc.applyPalette(f.img.data, pal, 'rgb565');
      }
      var opts = { delay: f.delay };
      if (k === 0) { opts.palette = pal; opts.repeat = 0; }
      enc.writeFrame(idx[fi], st.w, st.h, opts);
      setProg('prog2', (k + 1) / seq.length, 'GIF 인코딩 ' + (k + 1) + ' / ' + seq.length);
      if (k % 2 === 0) await tick();
    }
    enc.finish();
    var bytes = enc.bytesView ? enc.bytesView() : enc.bytes();
    var blob = new Blob([bytes], { type: 'image/gif' });
    st.cache[key] = blob;
    $('prog2').hidden = true;
    st.sizes.GIF = blob.size; renderChips();
    $('outNote').textContent = 'GIF ' + fmtB(blob.size) +
      ' 저장했습니다. 용량이 크면 가로 크기 · fps · 색상 수를 낮춰 보세요.' + SAVE_HINT;
    download(blob, outName('gif'));
  } catch (e) {
    $('prog2').hidden = true;
    showErr('GIF 인코딩 실패: ' + (e && e.message ? e.message : e));
  }
  b1.disabled = b2.disabled = false;
}
function outName(ext) {
  var sp = $('selSpeed').value;
  return st.name +
    (st.cropMode !== 'off' ? '_crop' : '') +
    (sp !== '1' ? '_' + sp + 'x' : '') +
    (st.mode === 'boomerang' ? '_boomerang' : '') + '.' + ext;
}

/* ---------- 동영상 저장 (MediaRecorder) ---------- */
var MIMES = [
  'video/mp4;codecs=avc1.42E01E',
  'video/mp4',
  'video/webm;codecs=vp9',
  'video/webm;codecs=vp8',
  'video/webm'
];
function pickMime() {
  if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return null;
  for (var i = 0; i < MIMES.length; i++) if (MediaRecorder.isTypeSupported(MIMES[i])) return MIMES[i];
  return null;
}

$('btnVid').addEventListener('click', function () { exportVideo(); });

function exportVideo() {
  if (st.busy) { showErr('프레임 추출이 끝난 뒤에 저장해 주세요.'); return; }
  if (!st.frames.length) return;
  var mime = pickMime();
  if (!mime) { showErr('이 브라우저는 동영상 녹화(MediaRecorder)를 지원하지 않습니다. GIF로 저장해 주세요.'); return; }
  showErr('');
  var b1 = $('btnGif'), b2 = $('btnVid');
  b1.disabled = b2.disabled = true;
  $('prog2').hidden = false;

  var seq = seqOf(st.frames.length);
  var loops = 2, total = seq.length * loops;
  var cv = document.createElement('canvas');
  cv.width = st.w; cv.height = st.h;
  var ctx = cv.getContext('2d');
  ctx.putImageData(st.frames[seq[0]].img, 0, 0);

  var fps = 1000 / st.base;
  var stream = cv.captureStream(Math.max(1, Math.round(fps)));
  var rec;
  try {
    rec = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: Math.min(12e6, Math.max(8e5, Math.round(st.w * st.h * fps * 0.14)))
    });
  } catch (e) {
    showErr('녹화기 초기화 실패: ' + e.message);
    b1.disabled = b2.disabled = false; $('prog2').hidden = true;
    return;
  }
  var chunks = [];
  rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onerror = function (e) {
    showErr('녹화 실패: ' + ((e.error && e.error.message) || 'unknown'));
    b1.disabled = b2.disabled = false; $('prog2').hidden = true;
  };
  rec.onstop = function () {
    var blob = new Blob(chunks, { type: mime });
    var ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    $('prog2').hidden = true;
    b1.disabled = b2.disabled = false;
    st.sizes[ext.toUpperCase()] = blob.size; renderChips();
    $('outNote').textContent = ext.toUpperCase() + ' ' + fmtB(blob.size) +
      ' 저장했습니다. GIF보다 훨씬 작지만, 자동 반복 재생은 보는 쪽 플레이어에 따라 다릅니다.' + SAVE_HINT;
    download(blob, outName(ext));
  };

  rec.start();
  var t0 = performance.now(), k = 0, acc = 0;
  (function step() {
    if (k >= total) {
      setTimeout(function () { try { rec.stop(); } catch (e) { /* 무시 */ } }, st.base + 80);
      return;
    }
    var f = st.frames[seq[k % seq.length]];
    ctx.putImageData(f.img, 0, 0);
    k++; acc += f.delay;
    setProg('prog2', k / total, '동영상 녹화 ' + k + ' / ' + total);
    setTimeout(step, Math.max(0, t0 + acc - performance.now()));
  })();
}

/* ---------- 시작 ---------- */
loadSettings();
/* 지원 현황을 화면에 직접 띄운다. 비활성 버튼에 title 툴팁만 달면
   폰에서는 hover 가 없어 이유를 볼 방법이 아예 없다. */
(function showSupport() {
  var vm = pickMime();
  var vLabel = vm ? (vm.indexOf('mp4') >= 0 ? 'MP4' : 'WebM') : null;
  var line = '이 브라우저 지원 — GIF ✓ · WebP ' + (WEBP_OK ? '✓' : '✗') +
    ' · 동영상 ' + (vLabel ? '✓ ' + vLabel : '✗');
  var extra = '';
  if (!WEBP_OK) {
    $('btnWebp').disabled = true;
    $('btnWebp').title = '이 브라우저에는 WebP 인코더가 없습니다';
    extra = '<br><span class="warn">WebP 저장을 쓸 수 없습니다 — 이 브라우저에 캔버스 WebP 인코더가 없습니다(Safari 계열).' +
      (vLabel ? ' <b>동영상으로 저장</b>(' + vLabel + ')을 쓰시면 용량이 WebP와 비슷합니다.' : '') +
      '</span>';
  }
  if (!vLabel) {
    $('btnVid').disabled = true;
    $('btnVid').title = '이 브라우저는 MediaRecorder를 지원하지 않습니다';
  }
  $('supNote').innerHTML = line + extra;
})();
window.addEventListener('beforeunload', function () { if (st.url) URL.revokeObjectURL(st.url); });

})();
</script>
